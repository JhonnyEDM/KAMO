name: Bug report
description: Something in KAMO or the game doesn't work right.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach or link a ROM or BIOS file.** Issues that do will be deleted.
        Can't open the app or your ROM isn't accepted? See [Playing](https://github.com/JhonnyEDM/KAMO#playing) first. Only Kirby & The Amazing Mirror (USA) is supported.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I am on the [latest release](https://github.com/JhonnyEDM/KAMO/releases/latest) and searched the [existing issues](https://github.com/JhonnyEDM/KAMO/issues?q=is%3Aissue).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game or which menu, and what you pressed. Say if it happens every time.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KAMO version
      description: The number in the name of the zip you downloaded.
      placeholder: "0.2.2-alpha"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Optional. Drag files here. Helpful for graphics or sound problems.
